; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = FM449/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; upload_port = COM3
; monitor_port = COM3
monitor_speed = 115200

lib_deps =
    blynkkk/Blynk @ ^1.3.2

board_build.filesystem = littlefs

build_flags =
    -I include
    -L "${PROJECT_DIR}/lib_bsec"
    -lalgobsec